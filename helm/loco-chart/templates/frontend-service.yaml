apiVersion: v1
kind: Service
metadata:
  name: {{ include "loco.fullname" . }}-frontend
  namespace: {{ include "loco.namespace" . }}
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lego-loco-cluster
    app.kubernetes.io/name: lego-loco-frontend
spec:
  type: NodePort
  selector:
    app: {{ include "loco.fullname" . }}-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lego-loco-cluster
  ports:
  - name: http
    port: {{ .Values.frontend.servicePort }}
    targetPort: {{ .Values.frontend.servicePort }}
    {{- if .Values.frontend.nodePort }}
    nodePort: {{ .Values.frontend.nodePort }}
    {{- end }}
  {{- if .Values.frontend.tlsNodePort }}
  # Rides the kind extraPortMapping host 6080 -> 30080, which nothing else
  # claims; WebXR headsets on the LAN need https to get a secure context.
  - name: https
    port: {{ .Values.frontend.tlsPort }}
    targetPort: {{ .Values.frontend.tlsPort }}
    nodePort: {{ .Values.frontend.tlsNodePort }}
  {{- end }}
